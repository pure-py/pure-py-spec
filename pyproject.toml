[project]
name = "purepy-spec"
version = "0.23.0"
requires-python = ">=3.12"
dependencies = [
    "purepy @ https://github.com/pure-py/isabelle-purepy/releases/download/v0.24.0/purepy-0.24.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
