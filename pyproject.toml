[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purepy"
version = "0.23.0"
requires-python = ">=3.12"

[project.scripts]
purepy = "purepy.__main__:main"
purepy-conformance = "purepy.conformance:main"
purepy-mechanised = "purepy.mechanised:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true

# Code generated from the mechanisation, untyped
[[tool.mypy.overrides]]
module = ["Finite_Map", "Option", "Rat", "Real", "String", "Syntax", "Typing"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = ["src/purepy/conformance-suite"]

[tool.hatch.build.targets.wheel]
packages = ["src/purepy"]
