[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purepy-conformance"
description = "conformance suite"
version = "0.27.6"
requires-python = ">=3.12"

[project.scripts]
purepy-conformance = "purepy_conformance:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true
files = ["src/purepy_conformance/__init__.py", "test", "script"]
mypy_path = "script"

[tool.ruff]
line-length = 100
extend-exclude = ["src/purepy_conformance/conformance-suite", "evaluation"]

# Annotations unevaluated in every module, so no type needs quoting
[tool.ruff.lint]
extend-select = ["I002"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.hatch.build.targets.wheel]
packages = ["src/purepy_conformance"]
artifacts = ["src/purepy_conformance/figure-numbers.json"]
