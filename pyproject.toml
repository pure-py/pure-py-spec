[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purepy"
version = "0.22.1"
requires-python = ">=3.12"

[project.scripts]
purepy = "purepy.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/purepy"]
