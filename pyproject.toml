[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purepy-conformance"
version = "0.23.1"
requires-python = ">=3.12"

[project.scripts]
purepy-conformance = "purepy_conformance:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
extend-exclude = ["src/purepy_conformance/conformance-suite"]

[tool.hatch.build.targets.wheel]
packages = ["src/purepy_conformance"]
