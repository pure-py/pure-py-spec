[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ourlang"
version = "0.23.2"
requires-python = ">=3.12"

[project.scripts]
ourlang = "ourlang.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ourlang-conformance",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true

# Generated code untyped; not followed by mypy
[[tool.mypy.overrides]]
module = ["ourlang.generated.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
extend-exclude = ["src/ourlang/generated"]

[tool.hatch.build.targets.wheel]
packages = ["src/ourlang"]
# Generated by the build, not committed
artifacts = ["src/ourlang/generated/"]

[tool.uv.sources]
ourlang-conformance = { path = "ourlang_conformance-0.23.2-py3-none-any.whl" }
