name: Status page

# Dependency diagram and open pull requests of the organisation's repositories, published to GitHub Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Hourly
  push:
    branches: [main]
    paths:
      - script/dependency-diagram.py
      - script/status-page.py
      - .github/workflows/status.yml

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clone repositories of the organisation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo list pure-py --no-archived --json name --jq '.[].name' |
            xargs -I{} git clone -q --depth 1 https://github.com/pure-py/{}.git repos/{}

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.9.0

      - name: Draw diagram
        shell: bash  # Fails the step when the script fails, since bash then sets pipefail
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/dependency-diagram.py repos | d2 --pad 16 - dependencies.svg

      - name: Build page
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/status-page.py repos > status.html

      # Committed only when something other than the update time changes
      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages pages origin/gh-pages
          cp dependencies.svg status.html pages/
          cd pages
          git add -A
          git diff --quiet --cached -I '<time>' || { git commit -m "Status page"; git push origin gh-pages; }
