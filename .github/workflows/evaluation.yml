name: Evaluation pipeline

on:
  push:
    paths: &paths
      - evaluation/**
      - .github/workflows/evaluation.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: evaluation

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    env:
      MPLBACKEND: Agg
      UV_PROJECT_ENVIRONMENT: .venv

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.13"
          python-version: "3.12"
          enable-cache: true

      - name: Install the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zstd
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Run the pipeline with a local model on every benchmark
        env:
          SMOKE_BENCHMARKS: humaneval humaneval-plus mbpp-plus livecodebench
          SMOKE_LIMIT: 1
          SMOKE_OUTPUT_DIR: results/ci/${{ runner.os }}
        run: bash scripts/smoke.sh

      - name: Import the HumanEval run into Harbor
        run: bash scripts/harbor-import.sh --file "results/ci/${{ runner.os }}/humaneval/qwen2.5-coder-0.5b.json"

      - name: Compile the generated figure
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
          bash scripts/check-figure.sh "results/ci/${{ runner.os }}/humaneval/qwen2.5-coder-0.5b.tex"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ runner.os }}
          path: evaluation/results/ci/
          if-no-files-found: warn
