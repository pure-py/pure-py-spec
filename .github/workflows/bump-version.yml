name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z, e.g. 0.1.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Parse and validate version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be in the form x.y.z (no leading v)"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          TAG="v$VERSION"

          sed -i "s/\\\\version{[0-9]*}{[0-9]*}{[0-9]*}/\\\\version{$MAJOR}{$MINOR}{$PATCH}/" paper.tex PurePy-spec.tex
          sed -i "s|## \[v[0-9]*\.[0-9]*\.[0-9]*\](https://pure-py.github.io/pure-py-spec/v[0-9]*\.[0-9]*\.[0-9]*/PurePy-spec.pdf)|## [$TAG](https://pure-py.github.io/pure-py-spec/$TAG/PurePy-spec.pdf)|" README.md
          sed -i "s|\[v[0-9]*\.[0-9]*\.[0-9]*\](https://pure-py.github.io/pure-py-spec/v[0-9]*\.[0-9]*\.[0-9]*/mechanisation.pdf)|[$TAG](https://pure-py.github.io/pure-py-spec/$TAG/mechanisation.pdf)|" README.md

          uv version "$VERSION"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit and push version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper.tex PurePy-spec.tex README.md pyproject.toml uv.lock
          git diff --cached --quiet || git commit -m "Bump version to ${{ steps.version.outputs.tag }}"
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main

      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Generate Python and mypy version macros
        run: make tex/python-version.tex tex/mypy-version.tex

      - name: Build LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: PurePy-spec.tex

      # Built before the Pages worktree is added, which would otherwise be included in the source distribution.
      - name: Build wheel and source distribution
        run: uv build

      # The PDF is served from GitHub Pages rather than attached to the release, since GitHub serves release files
      # as downloads, which drops the destination named in a link such as PurePy-spec.pdf#fig:typing-synth.
      - name: Publish PDF to GitHub Pages
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages pages origin/gh-pages
          mkdir -p "pages/$TAG" pages/latest
          cp PurePy-spec.pdf "pages/$TAG/"
          cp PurePy-spec.pdf pages/latest/
          cd pages
          bash ../.github/scripts/pages-index.sh
          git add -A
          git commit -m "Specification $TAG"
          git push origin gh-pages

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body: "Specification: https://pure-py.github.io/pure-py-spec/${{ steps.version.outputs.tag }}/PurePy-spec.pdf"
          files: |
            dist/*.whl
            dist/*.tar.gz

  mechanisation-version:
    needs: bump-version
    runs-on: ubuntu-latest
    outputs:
      isabelle: ${{ steps.read.outputs.isabelle }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
          submodules: recursive
          token: ${{ secrets.PURE_PY_ISABELLE }}
      - id: read
        run: echo "isabelle=$(cat isabelle-purepy/.isabelle-version)" >> "$GITHUB_OUTPUT"

  mechanisation:
    needs: [bump-version, mechanisation-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official image, with HOL prebuilt, at the release the mechanisation is checked with. Runs as root so
      # that checkout and apt can write.
      image: makarius/isabelle:${{ needs.mechanisation-version.outputs.isabelle }}
      options: --user root
    steps:
      - name: Install packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            git make ca-certificates texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-plain-generic lmodern

      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
          submodules: recursive
          token: ${{ secrets.PURE_PY_ISABELLE }}
          persist-credentials: false

      - name: Build mechanisation and its document
        run: make -C isabelle-purepy build ISABELLE=/home/isabelle/Isabelle/bin/isabelle

      - name: Publish document to GitHub Pages
        run: |
          TAG="${{ needs.bump-version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages pages origin/gh-pages
          mkdir -p "pages/$TAG" pages/latest
          cp isabelle-purepy/output/document.pdf "pages/$TAG/mechanisation.pdf"
          cp isabelle-purepy/output/document.pdf pages/latest/
          cd pages
          bash ../.github/scripts/pages-index.sh
          git add -A
          git commit -m "Mechanisation $TAG"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
