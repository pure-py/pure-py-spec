name: Paper

# Paper, specification and evaluation pipeline as one status
on:
  workflow_dispatch:
  push:

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Sources the branch changes relative to main, so every push gets a status and a branch that touched the
  # paper rebuilds it on every push
  changes:
    runs-on: ubuntu-latest
    outputs:
      documents: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.documents == 'true' }}
      evaluation: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.evaluation == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List changed sources
        id: paths
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            documents:
              - '**'
              - '!src/purepy_conformance/**'
              - '!test/**'
              - '!script/**'
              - '!.claude/**'
              - '!**/README.md'
              - '!.github/workflows/bump-version.yml'
              - '!.github/workflows/check-project-integrity.yml'
              - '!.github/workflows/consistency-checks.yml'
              - '!.github/workflows/status.yml'
            evaluation:
              - 'evaluation/**'
              - '.github/workflows/paper.yml'

  documents:
    needs: changes
    if: needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            make \
            texlive-latex-extra texlive-fonts-extra texlive-science \
            texlive-publishers texlive-bibtex-extra texlive-plain-generic

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build paper and specification
        run: make paper.pdf paper-anon.pdf PurePy-spec.pdf spec-anon.pdf graduality.pdf

  evaluation:
    needs: changes
    if: needs.changes.outputs.evaluation == 'true'
    name: evaluation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    defaults:
      run:
        working-directory: evaluation

    env:
      MPLBACKEND: Agg
      UV_PROJECT_ENVIRONMENT: .venv

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.13"
          python-version: "3.12"
          enable-cache: true

      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zstd
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pipeline with local model on every benchmark
        env:
          SMOKE_BENCHMARKS: humaneval-plus mbpp-plus livecodebench
          SMOKE_LIMIT: 1
          SMOKE_OUTPUT_DIR: results/ci/${{ runner.os }}
        run: bash scripts/smoke.sh

      - name: Import HumanEval+ run into Harbor
        run: bash scripts/harbor-import.sh --file "results/ci/${{ runner.os }}/humaneval-plus/qwen2.5-coder-0.5b.json"

      - name: Check smoke-run figure compiles
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
          bash scripts/check-figure.sh "results/ci/${{ runner.os }}/humaneval-plus/qwen2.5-coder-0.5b.tex"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ runner.os }}
          path: evaluation/results/ci/
          if-no-files-found: warn
