name: Paper

# Build only the paper when only the paper changes; any other change runs the full Build workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - paper.tex
      - paper/**
      - .github/workflows/paper.yml

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            make \
            texlive-latex-extra texlive-fonts-extra texlive-science \
            texlive-publishers texlive-bibtex-extra texlive-plain-generic

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build paper
        run: make paper.pdf paper-anon.pdf
