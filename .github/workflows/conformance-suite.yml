name: Conformance suite

# Run only when the type checker, the suite or their environment change; the paper and specification have
# their own Build workflow. The path filter applies to each push, so a pull request which touches the type
# checker does not rerun the suite for a push which does not.
on:
  workflow_dispatch:
  push:
    paths:
      - src/**
      - test/**
      - isabelle-purepy
      - Makefile
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/conformance-suite.yml

concurrency:
  group: conformance-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: CPython

          - runtime: GraalPy
            version: "graalpy-25.2"

          - runtime: Pyodide

    steps:
      # The submodule holds the generated type checker
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PURE_PY_ISABELLE }}

      - name: Set up CPython
        if: matrix.runtime == 'CPython'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up GraalPy
        if: matrix.runtime == 'GraalPy'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}

      - name: Set up uv for CPython
        if: matrix.runtime == 'CPython'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install CPython dependencies
        if: matrix.runtime == 'CPython'
        run: uv sync --locked

      - name: Set up uv for Pyodide
        if: matrix.runtime == 'Pyodide'
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Pyodide
        if: matrix.runtime == 'Pyodide'
        run: |
          uv python install "pyodide@$(cat .python-version)"
          PYODIDE_PYTHON="$(uv python find "pyodide@$(cat .python-version)")"
          echo "PYODIDE_PYTHON=$PYODIDE_PYTHON" >> "$GITHUB_ENV"

      - name: Run tests with CPython
        if: matrix.runtime == 'CPython'
        run: make check-tests

      - name: Run tests with GraalPy
        if: matrix.runtime == 'GraalPy'
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/isabelle-purepy/python/generated
        run: |
          test/run-all.sh python --no-mypy

      - name: Run tests with Pyodide
        if: matrix.runtime == 'Pyodide'
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/isabelle-purepy/python/generated
        run: |
          test/run-all.sh "$PYODIDE_PYTHON" --no-mypy
