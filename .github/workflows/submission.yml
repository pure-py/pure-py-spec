name: Submission

# Submission artifact built and checked on request, with the report and the artifact uploaded
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      isabelle: ${{ steps.read.outputs.isabelle }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      # Falls back to main when the mechanisation has no release at the specification's version, so that the
      # archive step reports the missing release
      - name: Read Isabelle version of the mechanisation release
        id: read
        run: |
          repo=https://raw.githubusercontent.com/pure-py/isabelle-purepy
          tag="v$(uv version --short --color never)"
          version=$(curl -fsSL "$repo/$tag/.isabelle-version" || curl -fsSL "$repo/main/.isabelle-version")
          test -n "$version"
          echo "isabelle=$version" >> "$GITHUB_OUTPUT"

  submission:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: makarius/isabelle:${{ needs.version.outputs.isabelle }}
      options: --user root
    steps:
      - name: Install packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            make git zip unzip curl ca-certificates \
            texlive-latex-extra texlive-fonts-extra texlive-science \
            texlive-publishers texlive-bibtex-extra texlive-plain-generic

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build and check the submission
        run: |
          uv run --no-project python script/submission-report.py check-submission \
            ISABELLE=/home/isabelle/Isabelle/bin/isabelle > submission.tsv

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-report
          path: submission.tsv

      - name: Upload submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission
          path: |
            paper-anon.pdf
            supplementary.zip
