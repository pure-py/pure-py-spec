name: Documents

# Specification documents as one status
on:
  workflow_dispatch:
  push:

concurrency:
  group: documents-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Sources the branch changes relative to main, so every push gets a status and a branch that touched the
  # documents rebuilds them on every push
  changes:
    runs-on: ubuntu-latest
    outputs:
      documents: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.documents == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List changed sources
        id: paths
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            documents:
              - '**'
              - '!src/purepy_conformance/**'
              - '!test/**'
              - '!script/**'
              - '!.claude/**'
              - '!**/README.md'
              - '!.github/workflows/bump-version.yml'
              - '!.github/workflows/consistency-checks.yml'

  documents:
    needs: changes
    if: needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      # Outside the LaTeX container, which lacks uv
      - name: Generate mechanisation names and conformance counts
        run: make tex/mechanisation-names.tex tex/conformance-counts.tex

      # Make as compiler, for its checks of unresolved references; the root file, passed by the action as a further
      # target, is already up to date
      - name: Build specification
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Makefile
          compiler: make
          args: PurePy-spec.pdf spec-anon.pdf graduality.pdf
          extra_system_packages: make
