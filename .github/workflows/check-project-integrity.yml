name: check-project-integrity

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/check-project-integrity
      with:
        org: pure-py
        repo: pure-py-spec
        project: 1
        active-statuses: In progress,Awaiting Review
        token: ${{ secrets.PROJECT_PAT }}
