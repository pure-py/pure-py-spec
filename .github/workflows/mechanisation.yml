name: Mechanisation

on:
  workflow_dispatch:
  push:
    # A change to the paper or specification alone is built by the Documents workflow.
    paths-ignore:
      - README.md
      - paper.tex
      - paper/**
      - PurePy-spec.tex
      - spec/**
      - tex/**

concurrency:
  group: mechanisation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      isabelle: ${{ steps.read.outputs.isabelle }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PURE_PY_ISABELLE }}
      - id: read
        run: echo "isabelle=$(cat isabelle-purepy/.isabelle-version)" >> "$GITHUB_OUTPUT"

  submit:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # Official image, with HOL prebuilt, at the release the mechanisation is checked with. Runs as root so
      # that checkout and apt can write.
      image: makarius/isabelle:${{ needs.version.outputs.isabelle }}
      options: --user root
    steps:
      - name: Install packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            git make ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PURE_PY_ISABELLE }}
          fetch-depth: 0

      - name: Fetch mechanisation main for the ancestor check
        run: git -C isabelle-purepy fetch -q origin main

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Add Isabelle to PATH
        run: echo "/home/isabelle/Isabelle/bin" >> "$GITHUB_PATH"

      - name: Run the conformance suite under the generated type checker
        run: make check-tests
