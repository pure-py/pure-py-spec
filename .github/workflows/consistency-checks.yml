name: Consistency checks

# Check the specification against the conformance suite of the purepy release in uv.lock. The paper and
# specification are built by the Documents workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - spec/**
      - paper/**
      - test/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/consistency-checks.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run the checks
        run: make check-consistency
