name: Consistency checks

on:
  workflow_dispatch:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Specification built for the figure numbers exported by the wheel
      - name: Generate Python and mypy version macros
        run: make tex/python-version.tex tex/mypy-version.tex

      - name: Build LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: PurePy-spec.tex

      - name: Keep LaTeX auxiliary file of specification
        run: mkdir -p xref && cp PurePy-spec.aux xref/

      - name: Run checks and build wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: make wheel
