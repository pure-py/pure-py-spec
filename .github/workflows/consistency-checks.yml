name: Consistency checks

# Specification against the conformance suite, and wheel of the conformance suite and runner; paper and specification
# built by the Documents workflow
on:
  workflow_dispatch:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run checks and build wheel
        run: make wheel
