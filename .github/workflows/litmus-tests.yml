name: Litmus tests

# Run only when the checker, the tests or their environment change; the paper and
# specification have their own Build workflow.
on:
  push:
    branches: ["main"]
    paths: &paths
      - src/**
      - test/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/litmus-tests.yml
  pull_request:
    paths: *paths

jobs:
  test:
    name: test (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: CPython

          - runtime: GraalPy
            version: "graalpy-25.2"

          - runtime: Pyodide

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up CPython
        if: matrix.runtime == 'CPython'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up GraalPy
        if: matrix.runtime == 'GraalPy'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}

      - name: Set up uv for CPython
        if: matrix.runtime == 'CPython'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install CPython dependencies
        if: matrix.runtime == 'CPython'
        run: uv sync --locked

      - name: Set up uv for Pyodide
        if: matrix.runtime == 'Pyodide'
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Pyodide
        if: matrix.runtime == 'Pyodide'
        run: |
          uv python install "pyodide@$(cat .python-version)"
          PYODIDE_PYTHON="$(uv python find "pyodide@$(cat .python-version)")"
          echo "PYODIDE_PYTHON=$PYODIDE_PYTHON" >> "$GITHUB_ENV"

      - name: Run tests with CPython
        if: matrix.runtime == 'CPython'
        run: |
          uv run --locked ./test/run-all.sh python

      - name: Run tests with GraalPy
        if: matrix.runtime == 'GraalPy'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          test/run-all.sh python --no-mypy

      - name: Run tests with Pyodide
        if: matrix.runtime == 'Pyodide'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          test/run-all.sh "$PYODIDE_PYTHON" --no-mypy
